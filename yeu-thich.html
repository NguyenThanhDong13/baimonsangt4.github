<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yêu thích - Hướng Dẫn Nấu Ăn</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .favorites-page {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .favorites-page h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .favorites-status {
            text-align: center;
            margin-bottom: 24px;
        }

        .favorites-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
        }

        .favorites-list .mon-card {
            width: 100%;
            max-width: 350px;
            margin: 0 auto;
        }

        .favorite-detail-link {
            display: block;
            color: inherit;
            text-decoration: none;
        }

        .favorite-remove {
            margin: 16px;
            padding: 10px 16px;
            border: 0;
            border-radius: 8px;
            background: #a94708;
            color: white;
            cursor: pointer;
        }

        .favorite-remove:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #favoriteRetry {
            margin: 12px auto;
            display: block;
        }

        #favoriteRetry[hidden],
        #favoriteLogin[hidden] {
            display: none;
        }
    </style>

    <script src="config.js" defer></script>
    <script src="script.js" defer></script>
    <script src="yeu-thich.js" defer></script>
</head>

<body>
    <header>
        <div class="logo">🍳 HƯỚNG DẪN NẤU ĂN</div>

        <nav>
            <a href="index.html">Trang chủ</a>
            <a href="mon-an.html">Món ăn</a>
            <a href="yeu-thich.html" aria-current="page">Yêu thích</a>
            <a href="dang-cong-thuc.html" class="recipe-link">
                Đăng công thức
            </a>
            <a href="admin.html" class="admin-link" hidden>Quản trị</a>
            <a href="dang-nhap.html" class="auth-link">Đăng nhập</a>
        </nav>
    </header>

    <main class="favorites-page">
        <h1>♥ Món ăn yêu thích</h1>

        <div class="favorites-status">
            <p id="favoriteStatus" role="status" aria-live="polite">
                Đang tải...
            </p>

            <a id="favoriteLogin" href="dang-nhap.html" hidden>
                Đăng nhập
            </a>

            <button id="favoriteRetry" type="button" hidden>
                Thử lại
            </button>
        </div>

        <section
            id="favoriteList"
            class="favorites-list"
            aria-label="Danh sách món yêu thích"
        ></section>
    </main>
</body>
</html>
