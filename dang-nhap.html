<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Hướng Dẫn Nấu Ăn</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="logo">
            🍳 HƯỚNG DẪN NẤU ĂN
        </div>

        <nav>
            <a href="index.html">Trang chủ</a>
            <a href="mon-an.html">Món ăn</a>
            <a href="danh-muc.html">Danh mục</a>
            <a href="dang-cong-thuc.html" class="recipe-link">Đăng công thức</a>
            <a href="dang-nhap.html" class="auth-link">Đăng nhập</a>
        </nav>
    </header>

    <main class="auth-page">
        <div class="auth-card">
            <h1 id="authTitle">Đăng nhập</h1>
            <p id="authSubtitle" class="auth-subtitle">Đăng nhập để đăng công thức món ăn của bạn.</p>

            <div class="auth-mode" role="group" aria-label="Chọn hình thức tài khoản">
                <button type="button" id="loginMode" aria-pressed="true">Đăng nhập</button>
                <button type="button" id="registerMode" aria-pressed="false">Đăng ký</button>
            </div>

            <form id="loginForm" class="form-box">
                <label for="username">Tên đăng nhập</label>
                <input type="text" id="username" name="username" placeholder="Nhập tên đăng nhập" autocomplete="username" required>

                <label for="password">Mật khẩu</label>
                <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" autocomplete="current-password" required>

                <div id="confirmPasswordField" hidden>
                    <label for="confirmPassword">Xác nhận mật khẩu</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Nhập lại mật khẩu" autocomplete="new-password">
                </div>

                <button type="submit" id="authSubmit">Đăng nhập</button>
            </form>

            <p id="loginMessage" class="form-message"></p>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>

</html>
